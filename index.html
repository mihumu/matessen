<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0a0a;--gold:#c9a227;--wine:#3b0a1a;--cream:#ede6d6;--panel:#141114;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--black);color:var(--cream);font-family:'EB Garamond',serif;min-height:100vh}
  header{padding:3rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid rgba(201,162,39,.3)}
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:2.8rem;margin:0;letter-spacing:.03em;color:var(--gold)}
  .sub{color:#a99a86;margin:.6rem 0 0;font-style:italic;font-size:1.05rem}
  main{max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;margin-top:2rem;background:rgba(201,162,39,.3)}
  .card{background:var(--panel);padding:1.8rem 1.5rem;cursor:pointer;transition:background .2s ease}
  .card:hover{background:#1c171a}
  .card .suitmark{font-size:1.5rem;color:var(--gold)}
  .card h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:.6rem 0 .3rem;font-size:1.4rem}
  .card p{margin:0;color:#a99a86;font-size:.92rem}
  .backbtn{background:none;border:1px solid var(--gold);color:var(--gold);padding:.5rem 1.2rem;font-family:'EB Garamond',serif;font-size:.95rem;cursor:pointer}
  .recipe-head span.suit{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--gold)}
  .portions{display:flex;align-items:center;gap:1rem;border:1px solid rgba(201,162,39,.4);padding:.9rem 1.3rem;margin:1.6rem 0;width:fit-content}
  .portions button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:1.1rem;cursor:pointer}
  .portions span{font-family:'Cormorant Garamond',serif;font-size:1.15rem;min-width:8ch;text-align:center}
  h2.recipe-title{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin:1.3rem 0 .2rem;font-weight:600}
  .cols{display:grid;grid-template-columns:1fr 1.4fr;gap:2.5rem;margin-top:1.2rem}
  @media(max-width:640px){.cols{grid-template-columns:1fr}}
  ul.ing{list-style:none;padding:0;margin:0}
  ul.ing li{padding:.55rem 0;border-bottom:1px solid rgba(201,162,39,.15)}
  h3.section{font-family:'Cormorant Garamond',serif;letter-spacing:.04em;color:var(--gold);border-bottom:1px solid rgba(201,162,39,.3);padding-bottom:.4rem;font-weight:600}
  ol.steps{padding-left:1.2rem}
  ol.steps li{margin-bottom:1rem;line-height:1.6}
  .qr-note{margin-top:2.5rem;padding:1.1rem 1.3rem;border-left:2px solid var(--gold);color:#c9bba3;font-size:.92rem;background:rgba(201,162,39,.05)}
  .error{margin-top:2rem;color:#f0b7b7}
</style>
</head>

const CATS = [];
const app=document.getElementById('app');
let state={view:'home',cat:null,recipeId:null,portions:null};

function scale(amount,base,portions){
  const v=amount*(portions/base);
  return (Math.round(v*100)/100).toString();
}
function render(){
  if(state.view==='home') return renderHome();
  if(state.view==='list') return renderList();
  if(state.view==='recipe') return renderRecipe();
}
function renderHome(){
  app.innerHTML=`<h2>Alla 54 kort</h2>
    <div class="qr-note">Välj ett kort för att öppna dess receptplats. Recept kommer läggas in snart. Varje kort har en egen adress för QR-koden.</div>
    <div class="grid">`+RECIPES.map(r=>`
      <div class="card" onclick="goRecipe(${r.id})">
        <span class="suitmark">${r.card}</span>
        <h3>${r.name}</h3>
        <p>Recept kommer läggas in snart</p>
      </div>`).join('')+`</div>`;
}
function renderList(){renderHome();}
function renderRecipe(){
  const r=RECIPES.find(x=>x.id===state.recipeId);
  if(!r){renderNotFound();return;}
  app.innerHTML=`<button class="backbtn" onclick="goHome()">← Till alla kort</button>
    <div class="recipe-head"><span class="suit">${r.card}</span></div>
    <h2 class="recipe-title">${r.name}</h2>
    <p style="color:#a99a86;margin-top:0;font-style:italic;">Recept kommer läggas in snart.</p>
    <div class="qr-note">Receptet för ${r.card} kommer läggas in snart. Den här adressen är kopplad till kort ${r.id} och ska behållas när receptet läggs till, så fortsätter QR-koden att fungera.</div>`;
}
function renderNotFound(){
  app.innerHTML=`<button class="backbtn" onclick="goHome()">← Till startsidan</button>
    <p class="error">Vi hittar inte receptet. Kontrollera QR-koden eller adressen.</p>`;
}
function setRoute(path){location.hash=path;}
function goHome(){setRoute('/');}
function goList(cat){setRoute('/kategori/'+cat);}
function goRecipe(id){setRoute('/recept/'+id);}
function changePortions(delta){
  state.portions=Math.max(1,Math.min(24,state.portions+delta));
  render();
}
function handleRoute(){
  const path=location.hash.slice(1)||'/';
  const parts=path.split('/').filter(Boolean);
  if(parts.length===0){
    state={view:'home',cat:null,recipeId:null,portions:null};
    render();return;
  }
  if(parts[0]==='kategori'&&parts.length===2){
    state={view:'home',cat:null,recipeId:null,portions:null};
    render();return;
  }
  if(parts[0]==='recept'&&parts.length===2){
    const id=Number(parts[1]);
    const recipe=RECIPES.find(r=>r.id===id);
    if(recipe){
      state={view:'recipe',cat:recipe.cat,recipeId:id,portions:null};
      render();return;
    }
  }
  state={view:'home',cat:null,recipeId:null,portions:null};
  renderNotFound();
}
window.addEventListener('hashchange',handleRoute);
handleRoute();
